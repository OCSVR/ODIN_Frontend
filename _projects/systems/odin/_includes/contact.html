{%- comment -%}
  The contact block. Its heading, labels and partner logo come from the backend's contact page, and
  the phone number, email and address from the site basics. The page that includes it loads both
  and hands them to showPage.
{%- endcomment -%}
<div class="ocs__card" id="contact">
  <div data-odin-section="details">
    <h2 data-odin-field="title"></h2>
  </div>
  <div class="ocs__split odin__row">
    <div class="ocs__stack">
      <p class="ocs__text" data-odin-section="phone">
        <strong data-odin-field="title"></strong>
        <a data-odin-basic="phone" data-odin-opens="tel"></a>
      </p>
      <p class="ocs__text" data-odin-section="email">
        <strong data-odin-field="title"></strong>
        <a data-odin-basic="email" data-odin-opens="mailto"></a>
      </p>
      <p class="ocs__text" data-odin-section="address">
        <strong data-odin-field="title"></strong>
        <span data-odin-basic="address"></span>
      </p>
    </div>
    <div data-odin-section="details">
      <a data-odin-href="link" target="_blank" rel="noopener noreferrer">
        <img class="odin__partner" data-odin-image data-odin-backdrop alt="">
      </a>
    </div>
  </div>
</div>
